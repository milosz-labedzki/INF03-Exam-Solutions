<body>
    <section id="kontener">

</section>
        <header>
            <img src="animacja.gif" alt="Usługi informatyczne">
        </header>
        

        <main>
            <h2>Kontakt</h2>
            <table>
                <form>
                <tr>
                    <td>Imię:</td>
                    <td><input type="text" id="imie"></td>
                </tr>
                <tr>
                    <td>Nazwisko:</td>
                    <td><input type="text" id="nazwisko"></td>
                </tr>
                <tr>
                    <td>E-mail:</td>
                    <td><input type="email" id="email"></td>
                </tr>
                <tr>
                    <td>Zgłoszenie</td>
                    <td><textarea id="zgloszenie" cols="40" rows="10"></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="checkbox" id="regulamin">Zapoznałam/em się z regulaminem</td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="reset">Resetuj</button> <button type="button" onclick="skrypt1()">Prześlij</button></td>
                </tr>
                </form>
            </table>
            <hr>
            <span id="wynik"></span>
        </main>


        <footer>
            <strong>Autor strony: Miłosz Łabędzki</strong>
        </footer>
    </section>
    <script>
        function skrypt1(){
            let wpisane = document.querySelector("#imie").value
            let imie = wpisane.substr(0,1).toUpperCase()+wpisane.substr(1).toLowerCase();
            let wpisane_naz = document.querySelector("#nazwisko").value
            let nazwisko = wpisane_naz.substr(0,1).toUpperCase()+wpisane.substr(1).toLowerCase();
            const email = document.querySelector("#email").value
            const zgloszenie = document.querySelector("#zgloszenie").value
            const regulamin = document.querySelector("#regulamin").checked
            if(!regulamin){
                document.querySelector("#wynik").innerHTML="Musisz zapoznać się z regulaminem."
                document.querySelector("#wynik").style.color="Red"
            }
            else if(regulamin){
                document.querySelector("#wynik").innerHTML=`${imie} ${nazwisko} Treść Twojej sprawy: ${zgloszenie}`
                document.querySelector("#wynik").style.color="Navy"
            }
        }
    </script>
</body>
