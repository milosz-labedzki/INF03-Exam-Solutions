<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biuro turystyczne</title>
    <link rel="stylesheet" href="styl.css">
    <script>
        function petla(){          
            let boczny = document.querySelector("#boczny")
            for(i=1; i<4; i+=1){
                for(j=1; j<4; j+=1){
                    let img = document.createElement("img")
                    img.alt="wycieczki"
                    img.src=`pliki4/${j}.jpg`
                    boczny.appendChild(img)
                }
            }
        }
    </script>
</head>
<body>
    <header>
        <h1>Rezerwacja wycieczek</h1>
    </header>


    <main>
        <nav>
            <button type="button" onclick="uczestnik()" id="uczestnik">Uczestnik</button>
            <button type="button" onclick="rezerwacja()" id="rezerwacja">Rezerwacja</button>
        </nav>


        <section id="pierwszy">
            <h2>Dane klienta</h2>
            <img src="pliki4/osoba.png" alt="Klient"><br>
            <label for="imie">Imię <input type="text" name="imie" id="imie" disabled></label><br>
            <label for="nazwisko">Nazwisko <input type="text" name="nazwisko" id="nazwisko"></label><br>
            <p><a href="wycieczki.html">Do storny głównej</a></p>
        </section>


        <section id="drugi">
            <h2>Dane rezerwacji</h2>
            <span onclick="zmiana_zdj()">&laquo;</span>
            <span onclick="zmiana_zdj()">&raquo;</span>
            <h4>Barcelona</h4><br>
            <label for="liczba_osob">Liczba osób: <input type="number" name="liczba_osob" id="liczba_osob" min="1" max="4" value="2" disabled></label><br>
            <label for="wylot">Miejsce wylotu: <select name="wylot" id="wylot" disabled><br>
            <option value="Warszawa">Warszawa</option>
            <option value="Kraków">Kraków</option>
            <option value="Wrocław">Wrocław</option>
            </select></label><br>
            <label for="sniadania">Śniadania</label><input type="radio" name="jedzenie" id="sniadania" disabled checked>
            <label for="obiado-kolacje">Śniadania i obiadokolacje</label><input type="radio" name="jedzenie" id="obiado-kolacje" disabled> 
            <label for="all-inclusive">All inclusive</label><input type="radio" name="jedzenie" id="all-inclusive" disabled><br>
            <button type="button">Sprawdź cene</button>
        </section>


        <aside id="boczny">
                <script>petla()</script>
        </aside>
    </main>


    <footer>
        <p>Autor strony: <em>Miłosz Łabędzki</em></p>
    </footer>
                <script>
                document.querySelector("#uczestnik").style.backgroundColor= "DodgerBlue";

            function uczestnik(){
                document.querySelector("#uczestnik").style.backgroundColor= "DodgerBlue";
                document.querySelector("#rezerwacja").style.backgroundColor= "Skyblue";
                document.querySelector("#imie").disabled = false
                document.querySelector("#nazwisko").disabled = false
                document.querySelector("#liczba_osob").disabled = true
                document.querySelector("#wylot").disabled = true
                document.querySelector("#sniadania").disabled = true
                document.querySelector("#obiado-kolacje").disabled = true
                document.querySelector("#all-inclusive").disabled = true
            }
            </script>
</body>
</html>
