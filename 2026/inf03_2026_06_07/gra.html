<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header>
        <h1>Zagraj w kółko i krzyżyk</h1>
    </header>


    <main>

    <section id="lewy">
        <h2>Gra kółko</h2>
    </section>


    <section id="srodek">
            <table>
                <tr>
                    <td><img src="nic.png" onclick="skrypt1('pierwszy')" id="pierwszy"></td>
                    <td><img src="nic.png" onclick="skrypt1('drugi')" id="drugi"></td>
                    <td><img src="nic.png" onclick="skrypt1('trzeci')" id="trzeci"></td>
                </tr>
                <tr>
                    <td><img src="nic.png" onclick="skrypt1('czwarty')" id="czwarty"></td>
                    <td><img src="nic.png" onclick="skrypt1('piaty')" id="piaty"></td>
                    <td><img src="nic.png" onclick="skrypt1('szosty')" id="szosty"></td>
                </tr>
                <tr>
                    <td><img src="nic.png" onclick="skrypt1('siodmy')" id="siodmy"></td>
                    <td><img src="nic.png" onclick="skrypt1('osmy')" id="osmy"></td>
                    <td><img src="nic.png" onclick="skrypt1('dziewiaty')" id="dziewiaty"></td>
                </tr>
            </table>
    </section>


    <section id="prawy">
            <h2>Gra krzyżyk</h2>
    </section>

    </main>


    <footer>
        <a href="http://pl.battleship-game.org/" target="_blank">Zagraj w statki</a>
        <p>Grę opracował: Miłosz Łabędzki</p>
    </footer>
    <script>
        let gracz = 'kolko'
        function skrypt1(miejsce){
           let pole = document.getElementById(miejsce)
            

                if(gracz == 'kolko'){
                    if(pole.getAttribute('src')=='nic.png'){
                        pole.src='o.png'
                        lewy.style.visibility='hidden'
                        prawy.style.visibility='visible'
                        gracz = 'iks'
                    }
                }

            
                else if(gracz == 'iks'){
                    if(pole.getAttribute('src')=='nic.png'){
                        pole.src='x.png'
                        lewy.style.visibility='visible'
                        prawy.style.visibility='hidden'
                        gracz = 'kolko'
                    }
                }
            



        }
    </script>
</body>
</html>
