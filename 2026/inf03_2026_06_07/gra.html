    <script>
        function skrypt1(miejsce){

            let drugi = document.querySelector("#drugi")
            let trzeci = document.querySelector("#trzeci")
            let czwarty = document.querySelector("#czwarty")
            let piaty = document.querySelector("#piaty")
            let szosty = document.querySelector("#szosty")
            let siodmy = document.querySelector("#siodmy")
            let osmy = document.querySelector("#osmy")
            let dziewiaty = document.querySelector("#dziewiaty")
            
            let lewy = document.querySelector("#lewy")
            let prawy = document.querySelector("#prawy")

            let gracz = 'kolko'
            if(gracz == 'kolko'){
                pierwszy.src='o.png'
                lewy.style.visibility='hidden'
                prawy.style.visibility='visible'
                let gracz = 'iks'
            }
        }
