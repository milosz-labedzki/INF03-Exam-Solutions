    <script>
        function skrypt1(){
        var pacjenci = {
        "id": "1",
        "imie": "Agnieszka",
        "nazwisko": "Nowak",
        "wystawca": "lek. Marian Kowal",
        "numer": "4387203",
        "recepty": [
            {"id": "0",  "data": "8.03.2025", "kod": "1220", "lek1": "Witamina C", "lek2": "Potas", "lek3": "Syrop prawoślazowy"},    
            {"id": "1",  "data": "23.04.2025", "kod": "4634", "lek1": "APAP", "lek2": "Witamina B", "lek3": ""},

            {"id": "3",  "data": "30.10.2025", "kod": "1105", "lek1": "Witamina C", "lek2": "Calcium", "lek3": "Sinupret"}
            ]
        };



        let prawy = document.querySelector("#prawy_2")
        let i = 0
        let tekst = ""
        while(pacjenci.recepty[i]){
            let div = document.createElement('div')
            div.classList.add("recepty")
            
            if(pacjenci.recepty[i].lek2 == ""){
                tekst = `<p>Data wystawienia ${pacjenci.recepty[i].data}</p>
                <ol><li>${pacjenci.recepty[i].lek1}</li></ol>
                <h4>Kod ${pacjenci.recepty[i].kod}</h4>`
            }
            else if(pacjenci.recepty[i].lek3 == ""){
                tekst = `<p>Data wystawienia ${pacjenci.recepty[i].data}</p>
                <ol><li>${pacjenci.recepty[i].lek1}</li> <li>${pacjenci.recepty[i].lek2}</li></ol>
                <h4>Kod ${pacjenci.recepty[i].kod}</h4>`
            }
            
            else{
                tekst = `<p>Data wystawienia ${pacjenci.recepty[i].data}</p>
                <ol><li>${pacjenci.recepty[i].lek1}</li><li>${pacjenci.recepty[i].lek2}</li><li>${pacjenci.recepty[i].lek3}</li></ol>
                <h4>Kod ${pacjenci.recepty[i].kod}</h4>`
            }

            div.innerHTML=tekst
            prawy.append(div)
            i++
        }
    
        }
    
    </script>
